(async()=>{
const box=document.getElementById('status');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

}catch(e){result+=line('官方加權指數K線資料',false,String(e.message||e))}
box.innerHTML=result;
})();
</script></body></html>
