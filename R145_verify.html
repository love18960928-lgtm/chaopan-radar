<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超盤手 R145 線上版本驗證</title>
<style>body{font:16px/1.6 system-ui,-apple-system,sans-serif;background:#0a1926;color:#e8f4fb;margin:0;padding:18px}main{max-width:690px;margin:auto}h1{font-size:1.45rem}section{border:1px solid #355366;border-radius:12px;background:#132c3d;padding:16px;margin:14px 0}b{color:#eaf6fb}.good{color:#83e0b0}.bad{color:#ffb18d}.warn{color:#ffd98d}small{color:#b4cbd9}button{background:#2c7894;color:white;padding:12px 16px;border:0;border-radius:8px;font-size:1rem}code{word-wrap:break-word}pre{white-space:pre-wrap;font-size:.8rem}</style></head>
<body><main><h1>超盤手 RADAR｜R145 線上版本驗證</h1>
<p>本頁不是行情或選股認證；只檢查 GitHub Pages 回傳的 JavaScript、首頁引用及快取線索。</p>
<button id="check">重新讀取並檢查</button><div id="results" aria-live="polite"><section>尚未檢查</section></div>
<section><b>驗證方法</b><p>把本頁與 <code>app-detail-swipe-v222.js</code> 解壓後一起上傳到 GitHub 主目錄；開啟 <code>R145_verify.html</code>。如果腳本顯示 R145，但首頁仍顯示 R139，需再檢查 <code>index.html</code> 的引用與 Service Worker 快取。</p><small>若網站被快取代理或 Service Worker 攔截，查到的是瀏覽器當下可讀的內容，不保證 GitHub 儲存庫最新版。</small></section>
</main><script>
const host=document.getElementById('results');
function clean(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function read(file){const u=new URL(file,location.href);u.searchParams.set('r145_audit',String(Date.now()));const response=await fetch(u.toString(),{cache:'no-store'});if(!response.ok)throw new Error(file+' HTTP '+response.status);return await response.text();}
async function verify(){host.innerHTML='<section>檢查中…</section>';let cards=[];
 try{let js=await read('app-detail-swipe-v222.js');const id=js.match(/const BUILD_ID\s*=\s*['"]([^'"]+)/),marker=js.match(/CHAOPAN_RADAR_BUILD:\s*([^*\n]+)/),valid=(id?.[1]||'').startsWith('R145-');cards.push(`<section><b class="${valid?'good':'bad'}">主程式：${valid?'R145 正確':'版本未符合 R145'}</b><p>BUILD_ID：${clean(id?.[1]||'未找到')}<br>原始標記：${clean((marker?.[1]||'未找到').trim())}</p><small>由網站讀取：${clean(new URL('app-detail-swipe-v222.js',location.href).pathname)}</small></section>`);}catch(e){cards.push(`<section class="bad">無法讀取主程式：${clean(e.message)}</section>`)}
 try{const html=await read('index.html');const ref=/\bapp-detail-swipe-v222\.js\b/.test(html);const old=[...html.matchAll(/r(?:139|140|141|142|143|144|145)\b/gi)].map(m=>m[0]);cards.push(`<section><b class="${ref?'good':'warn'}">首頁引用：${ref?'找到主程式檔名':'找不到主程式引用'}</b><p>首頁可見版本字樣：${clean([...new Set(old)].slice(0,12).join('、')||'無')}</p><small>找到檔名不代表瀏覽器沒有載入快取，請對照首頁實際顯示。</small></section>`);}catch(e){cards.push(`<section class="bad">無法讀取首頁：${clean(e.message)}</section>`)}
 const sw=navigator.serviceWorker?.controller?.scriptURL;
 cards.push(`<section><b>Service Worker</b><p>${sw?`目前頁面受 Service Worker 控制：<code>${clean(sw)}</code>`:'目前驗證頁面未由 Service Worker 控制（不能排除其他分頁仍受控制）'}</p><small>若主程式已 R145 但主頁顯示 R139，請先檢查首頁的靜態版本文字、引用路徑、Service Worker 的快取規則。</small></section>`);
 host.innerHTML=cards.join('');
}
document.getElementById('check').addEventListener('click',verify);verify();
</script></body></html>
