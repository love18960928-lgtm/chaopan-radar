name: 大量K雷達盤後自動更新
on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補日曆天數：0=最近7天；手動回補每批建議90天，最多120天'
        required: false
        default: '0'
      backfill_offset_days:
        description: '回補窗口結束距今幾天：依序執行 0、90、180、270、360（每批90天）'
        required: false
        default: '0'
  schedule:
    # 台灣週一至週五 09:00–20:30，每30分鐘嘗試補抓官方已公布資料。
    # GitHub Actions 使用 UTC；01:00–12:30 UTC = 台灣09:00–20:30。
    # 官方資料未公布時不會憑空產生新行情；排程亦可能延遲。
    - cron: '*/30 1-12 * * 1-5'
    # 週一至週五23:00再補抓一次晚間可能延後的資料。
    - cron: '0 15 * * 1-5'
    # 週一至週六08:30補查前一交易日資料。
    - cron: '30 0 * * 1-6'
permissions:
  contents: write
concurrency:
  group: eod-radar-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official Taiwan market data
        env:
          BACKFILL: ${{ github.event.inputs.backfill_days || '0' }}
          BACKFILL_OFFSET: ${{ github.event.inputs.backfill_offset_days || '0' }}
        run: |
          python scripts/collector.py --backfill "$BACKFILL" --backfill-offset "$BACKFILL_OFFSET" --delay 1.1
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect verified supplemental official EOD data
        # Optional feed may be missing: do not break existing OHLCV data.
        run: |
          if [ -f data/radar.json ]; then
            AS_OF=$(python -c 'import json;print(json.load(open("data/radar.json")).get("asOf",""))')
            if echo "$AS_OF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              if ! python scripts/market_intel_v311.py --as-of "$AS_OF"; then
                echo "::warning::官方盤後輔助來源抓取失敗；交易訊號不會套用未驗證法人資料，請看後續資料狀態報告"
              fi
            else
              echo "::warning::行情 asOf 日期格式錯誤或無行情資料，跳過法人抓取"
            fi
          else
            echo "::warning::沒有 data/radar.json，跳過法人抓取"
          fi
      - name: Build independently searchable stocks
        run: python scripts/build_stock_lookup.py
      - name: Rebuild all four three-low payloads from validated EOD data
        run: python scripts/build_three_low.py
      - name: Validate published snapshots, canonical levels and stock lookup
        run: python scripts/verify_release_gate_r4410.py
      - name: Explain market and institutional freshness in Actions summary
        if: always()
        run: python scripts/eod_freshness_report_r4411.py
      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/history.json data/radar.json data/universe.json data/stock-lookup three-low-data.json three-low-price-context.json three-low-volume-context.json ma240-three-low-context.json
          if [ -f data/market-intel.json ]; then git add data/market-intel.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update V2.2 unified radar"
            git push
          else
            echo "No data changes; existing published snapshot retained"
          fi
