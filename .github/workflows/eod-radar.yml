name: 大量K雷達盤後自動更新
on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補日曆天數：0=最近7天；手動回補每批建議90天，最多120天'
        required: false
        default: '0'
      backfill_offset_days:
        description: '回補窗口結束距今幾天：依序執行 0、90、180、270、360（每批90天）'
        required: false
        default: '0'
  workflow_call:
    inputs:
      backfill_days:
        type: string
        default: '0'
      backfill_offset_days:
        type: string
        default: '0'
  schedule:
    # R185: Taiwan weekdays 14:37, 15:47, 17:17, 19:17, 23:17.
    # Stagger from top/bottom of hour; preserve late official data catch-up.
    - cron: '37 6 * * 1-5'
    - cron: '47 7 * * 1-5'
    - cron: '17 9,11,15 * * 1-5'
    # Taiwan Mon-Sat 08:37 catch up previous trading day.
    - cron: '37 0 * * 1-6'
permissions:
  contents: write
concurrency:
  group: eod-radar-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official Taiwan market data
        env:
          BACKFILL: ${{ inputs.backfill_days || '0' }}
          BACKFILL_OFFSET: ${{ inputs.backfill_offset_days || '0' }}
        run: |
          # A single bounded window uses exactly the ordinary EOD release gate.
          if ! [[ "$BACKFILL" =~ ^[0-9]{1,3}$ && "$BACKFILL_OFFSET" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::Invalid backfill arguments"
            exit 1
          fi
          if (( 10#$BACKFILL > 120 || 10#$BACKFILL_OFFSET > 450 )); then
            echo "::error::Backfill limit: 120 days per workflow, 450 day offset"
            exit 1
          fi
          time python -u scripts/collector.py --backfill "$BACKFILL" --backfill-offset "$BACKFILL_OFFSET" --delay 1.1
      - name: Verify all strategy and data rules (required)
        run: time python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect verified supplemental official EOD data
        # Optional feed may be missing: do not break existing OHLCV data.
        run: |
          if [ -f data/radar.json ]; then
            AS_OF=$(python -c 'import json;print(json.load(open("data/radar.json")).get("asOf",""))')
            if echo "$AS_OF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              if ! time python -u scripts/market_intel_v311.py --as-of "$AS_OF"; then
                echo "::warning::官方盤後輔助來源抓取失敗；交易訊號不會套用未驗證法人資料，請看後續資料狀態報告"
              fi
            else
              echo "::warning::行情 asOf 日期格式錯誤或無行情資料，跳過法人抓取"
            fi
          else
            echo "::warning::沒有 data/radar.json，跳過法人抓取"
          fi
      - name: Verify and enrich official TWSE T86 institutional flows
        # T86 may publish later than OHLCV. A known T86 no-data response is
        # recorded as unavailable, not as zero and not as a verified risk signal.
        # All other data-integrity failures still fail the job.
        run: |
          time python -u scripts/update_institutions.py --radar data/radar.json --allow-unavailable
          python - <<'PYVERIFY'
          import json
          obj=json.load(open('data/radar.json', encoding='utf-8'))
          day=obj.get('asOf')
          coverage=obj.get('institutionalCoverage') or {}
          rows=[c for c in obj.get('candidates',[]) if c.get('market')=='上市' and (c.get('institutional') or {}).get('date')==day]
          print('T86_POSTWRITE', 'date=',day,'verifiedListedCandidates=',len(rows), 'status=',coverage.get('status','verified'))
          if coverage.get('status') == 'unavailable':
              assert not rows, 'unverified state must not assert same-day institutional matches'
              print('::warning::T86 not yet available; OHLCV can be checked by normal release gate; no same-day institutional claims')
          else:
              assert rows, 'no same-day institutional candidates persisted'
          PYVERIFY
      - name: Build independently searchable stocks
        run: time python -u scripts/build_stock_lookup.py
      - name: Rebuild all four three-low payloads from validated EOD data
        run: time python -u scripts/build_three_low.py
      - name: Validate published snapshots, canonical levels and stock lookup
        run: time python -u scripts/verify_release_gate_r4410.py
      - name: Report actual MA240 history coverage (not a certification)
        run: python scripts/ma240_coverage_check.py --min-coverage 0
      - name: Explain market and institutional freshness in Actions summary
        if: always()
        run: python scripts/eod_freshness_report_r4411.py
      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/history.json data/radar.json data/universe.json data/stock-lookup three-low-data.json three-low-price-context.json three-low-volume-context.json ma240-three-low-context.json
          if [ -f data/market-intel.json ]; then git add data/market-intel.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update V2.2 unified radar"
            # R186: safe non-fast-forward recovery; never force-push or merge generated JSON.
            for attempt in 1 2 3 4 5; do
              echo "R186 publish attempt $attempt/5"
              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
              if git merge-base --is-ancestor HEAD origin/main; then
                echo "R186_PUBLISH_OK already on main $(git rev-parse HEAD)"
                exit 0
              fi
              base=$(git rev-parse HEAD^)
              if ! git merge-base --is-ancestor "$base" origin/main; then
                echo "::error::Remote main history changed unexpectedly; start a new workflow on latest main."
                exit 1
              fi
              if [ "$base" != "$(git rev-parse origin/main)" ]; then
                # A different writer may have published data or changed the analysis engine.
                # Never auto-merge generated JSON or publish results from superseded inputs.
                if ! git diff --quiet "$base" origin/main -- scripts/ storage/ data/radar.json data/universe.json data/stock-lookup/ data/market-intel.json three-low-data.json three-low-price-context.json three-low-volume-context.json ma240-three-low-context.json .github/workflows/eod-radar.yml .github/workflows/ma240-backfill.yml; then
                  echo "::error::Market data or computation inputs changed on main; run a NEW workflow on latest main. No remote data overwritten."
                  exit 1
                fi
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "::error::Rebase conflict; run a NEW workflow on latest main."
                  exit 1
                fi
              fi
              if git push origin HEAD:refs/heads/main; then
                echo "R186_PUBLISH_OK $(git rev-parse HEAD)"
                exit 0
              fi
              echo "::warning::Push rejected or interrupted; fetching latest main before retry."
              if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 2))"; fi
            done
            echo "::error::Push retries exhausted; no force push attempted."
            exit 1
          else
            echo "No data changes; existing published snapshot retained"
          fi
