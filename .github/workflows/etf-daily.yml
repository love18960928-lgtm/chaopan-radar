name: ETF 盤後自動更新 (R201a)
on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: 'Expected minimum date YYYY-MM-DD; blank uses stock radar date'
        required: false
        default: ''
      publish_only:
        description: 'Publish existing ETF JSON without fetching again'
        type: boolean
        default: false
      full_history:
        description: 'Refetch 9 months instead of 2 months when history exists'
        type: boolean
        default: false
  # Chain only successful runs of the existing stock EOD workflow on main.
  workflow_run:
    workflows: ['大量K雷達盤後自動更新']
    types: [completed]
    branches: [main]
  # Human upload of this file/watchlist triggers a recovery run once.
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf-daily.yml'
      - 'data/etf-watchlist.json'
  # Independent catch-up if stock workflow is delayed or fails (Taipei UTC+8).
  schedule:
    - cron: '7 7 * * 1-5'   # 15:07
    - cron: '17 8 * * 1-5'  # 16:17
    - cron: '47 9 * * 1-5'  # 17:47
    - cron: '43 15 * * 1-5' # 23:43
    - cron: '43 0 * * 2-6'  # Tue-Sat 08:43
permissions:
  contents: write
  pages: write
concurrency:
  group: chaopan-etf-eod
  cancel-in-progress: false
jobs:
  etf-update:
    # workflow_run has write privileges: accept only successful same-repo main runs.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: R192 verify trigger and select stock trading date
        id: target
        env:
          REQUESTED_DATE: ${{ inputs.expected_date }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python -u - <<'PYTARGET'
          import datetime as dt, json, os
          from pathlib import Path
          day=os.environ.get('REQUESTED_DATE','').strip()
          if not day:
              radar=json.loads(Path('data/radar.json').read_text(encoding='utf-8'))
              day=radar.get('asOf','')
              if any((radar.get('marketAsOf') or {}).get(m)!=day for m in ('上市','上櫃')):
                  raise ValueError('Stock market dates inconsistent; cannot choose ETF target')
          if dt.date.fromisoformat(day).isoformat()!=day or day>dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).date().isoformat():
              raise ValueError('Invalid ETF target date')
          print('R192_TRIGGER',os.environ.get('TRIGGER'),'TARGET',day,flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('day='+day+'\n')
          PYTARGET
      - name: Verify ETF parser and data-safety rules
        if: ${{ !inputs.publish_only }}
        run: python -m unittest scripts/test_etf_daily.py -v
      - name: Fetch official ETF history (incremental when initialized)
        if: ${{ !inputs.publish_only }}
        env:
          FULL_HISTORY: ${{ inputs.full_history }}
          TARGET_DATE: ${{ steps.target.outputs.day }}
        run: |
          rm -f /tmp/r188-etf-fetched.json
          if python - <<'PYREADY'
          import json, os, sys
          try:
              codes=json.load(open('data/etf-watchlist.json',encoding='utf-8'))['codes']
              rows={r['code']:r for r in json.load(open('data/etf-daily.json',encoding='utf-8'))['rows']}
              ready=bool(codes) and all(len(rows[c]['bars'])>=60 and rows[c]['latestDate']>=os.environ['TARGET_DATE'] and rows[c]['bars'][-1][0]==rows[c]['latestDate'] for c in codes)
          except (OSError,ValueError,KeyError,IndexError,TypeError): ready=False
          sys.exit(0 if ready and os.environ.get('FULL_HISTORY')!='true' else 1)
          PYREADY
          then
            echo 'R192 ETF history already current; skip repeated monthly downloads; still check T86 and Pages'
            exit 0
          fi
          months=$(python - <<'PYMONTHS'
          import json, os
          try:
              codes=json.load(open('data/etf-watchlist.json'))['codes']
              rows={r['code']:r for r in json.load(open('data/etf-daily.json'))['rows']}
              complete=all(len(rows[c]['bars'])>=60 for c in codes)
          except (OSError,ValueError,KeyError,TypeError): complete=False
          print(2 if complete and os.environ.get('FULL_HISTORY')!='true' else 9)
          PYMONTHS
          )
          rm -f /tmp/r188-etf-fetched.json
          if ! python -u scripts/update_etf_daily.py --months "$months" --delay 0.9 --output /tmp/r188-etf-fetched.json; then
            echo "::warning::Monthly ETF source failed; attempting dated MI_INDEX fallback"
            rm -f /tmp/r188-etf-fetched.json
          fi
      - name: Merge verified bars without discarding existing history
        if: ${{ !inputs.publish_only }}
        run: |
          if [ ! -f /tmp/r188-etf-fetched.json ]; then echo 'No monthly payload; retain existing history'; exit 0; fi
          python -u - <<'PYMERGE'
          import json, math, datetime as dt
          from pathlib import Path

          def date(s):
              if not isinstance(s,str) or dt.date.fromisoformat(s).isoformat()!=s: raise ValueError('invalid date')
              return s

          def checked_rows(doc):
              if doc.get('schema')!=1 or doc.get('kind')!='etf-official-eod': raise ValueError('ETF schema mismatch')
              rows={}
              for r in doc['rows']:
                  code=r['code']; bars=r['bars']; days=[]
                  if code in rows or not bars: raise ValueError('duplicate code or empty bars')
                  for b in bars:
                      if len(b)!=6: raise ValueError('bar shape')
                      d,o,h,l,c,v=b; days.append(date(d))
                      if not all(isinstance(x,(int,float)) and not isinstance(x,bool) and math.isfinite(x) for x in b[1:]) or min(o,h,l,c)<=0 or h<max(o,l,c) or l>min(o,h,c) or v<0: raise ValueError('invalid OHLCV')
                  if days!=sorted(set(days)) or r['latestDate']!=days[-1] or r['barCount']!=len(bars) or r['close']!=bars[-1][4]: raise ValueError('row integrity '+code)
                  rows[code]=r
              if not rows or doc['asOf']!=max(r['latestDate'] for r in rows.values()): raise ValueError('invalid asOf')
              return rows

          def merge(old,new):
              prev=checked_rows(old) if old else {}; fresh=checked_rows(new); result=dict(prev)
              for code,r in fresh.items():
                  prior=prev.get(code)
                  if not prior: result[code]=r; continue
                  bars={b[0]:b for b in prior['bars']}; bars.update({b[0]:b for b in r['bars']})
                  # Keep latest metadata from the row that actually has latest quote, never downgrade it.
                  meta=dict(r if r['latestDate']>=prior['latestDate'] else prior)
                  meta['bars']=[bars[d] for d in sorted(bars)]
                  meta['barCount']=len(meta['bars']); meta['dataQuality']='verified_ohlcv' if meta['barCount']>=20 else 'short_history'
                  meta['close']=meta['bars'][-1][4]
                  # For a retained later quote, keep its official change metadata. Never infer ex-dividend change from stale rows.
                  # Distributions are historical events, not daily prices. Preserve verified metadata across quote refreshes.
                  if prior.get('distributionDetail') is not None and meta.get('distributionDetail') is None: meta['distributionDetail']=prior['distributionDetail']
                  if prior.get('navDetail') and prior['navDetail'].get('date')==meta['latestDate'] and meta.get('navDetail') is None: meta['navDetail']=prior['navDetail']
                  if prior.get('fundTaxId') and not meta.get('fundTaxId'): meta['fundTaxId']=prior['fundTaxId']
                  result[code]=meta
              doc=dict(new, rows=list(result.values()), asOf=max(r['latestDate'] for r in result.values()))
              checked_rows(doc); return doc

          if __name__=='__main__':
              p=Path('data/etf-daily.json'); old=json.loads(p.read_text()) if p.exists() else None
              new=json.loads(Path('/tmp/r188-etf-fetched.json').read_text())
              doc=merge(old,new)
              temp=p.with_suffix('.r188.tmp'); temp.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n'); temp.replace(p)
              for r in doc['rows']: print('ETF_ROW',r['code'],r['latestDate'],r['barCount'])
          PYMERGE
      - name: Repair missing latest ETF bars from official daily MI_INDEX (R191)
        if: ${{ !inputs.publish_only }}
        env:
          EXPECTED_DATE: ${{ steps.target.outputs.day }}
        run: |
          python -u - <<'PYDAILY'
          import datetime as dt, json, math, os, re, time, html, urllib.request
          from pathlib import Path
          
          SOURCE='TWSE MI_INDEX official daily EOD'
          API='https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX'
          FIELDS={'code':'證券代號','name':'證券名稱','volume':'成交股數','open':'開盤價','high':'最高價','low':'最低價','close':'收盤價','sign':'漲跌(+/-)','delta':'漲跌價差'}
          def norm(x):
              return re.sub(r'\s+','',str(x)).replace('（','(').replace('）',')')
          def number(x):
              s=str(x).replace(',','').strip()
              if not re.fullmatch(r'[+-]?\d+(?:\.\d+)?',s): raise ValueError('invalid number')
              f=float(s)
              if not math.isfinite(f): raise ValueError('nonfinite')
              return f
          
          def parse_daily(doc, day, codes):
              date=dt.date.fromisoformat(day)
              if doc.get('stat')!='OK' or str(doc.get('date','')) not in (day,date.strftime('%Y%m%d')):
                  raise ValueError('MI_INDEX date or status mismatch')
              tables=doc.get('tables',[])
              if not tables: tables=[doc]  # also accept single-table response
              matching=[]
              for table in tables:
                  fields=[norm(f) for f in table.get('fields',[])]
                  if all(fields.count(label)==1 for label in FIELDS.values()):
                      matching.append((table,{k:fields.index(label) for k,label in FIELDS.items()}))
              if len(matching)!=1: raise ValueError('MI_INDEX expected exactly one quote table')
              table,idx=matching[0]
              roc=re.search(r'(\d{2,3})年\s*(\d{1,2})月\s*(\d{1,2})日',str(table.get('title','')))
              if roc and dt.date(int(roc[1])+1911,int(roc[2]),int(roc[3]))!=date: raise ValueError('MI_INDEX table date mismatch')
              rows={}; seen=set()
              for row in table.get('data',[]):
                  if not isinstance(row,list) or len(row)<=idx['code']: continue
                  code=str(row[idx['code']]).strip()
                  if code not in codes: continue
                  if code in seen: raise ValueError('duplicate ETF quote '+code)
                  seen.add(code)
                  try:
                      name=str(row[idx['name']]).strip(); o,h,l,c,v=[number(row[idx[k]]) for k in ('open','high','low','close','volume')]
                      if not name or min(o,h,l,c)<=0 or h<max(o,l,c) or l>min(o,h,c) or v<0 or int(v)!=v: raise ValueError('invalid OHLCV')
                      sign=norm(html.unescape(re.sub(r'<[^>]*>','',str(row[idx['sign']])))).replace('＋','+').replace('－','-')
                      try:
                          delta=abs(number(row[idx['delta']]))
                          change=delta if sign=='+' else -delta if sign=='-' else 0.0 if sign=='' and delta==0 else None
                      except (ValueError,IndexError): change=None
                      previous=c-change if change is not None else None
                      pct=round(change/previous*100,4) if previous is not None and previous>0 else None
                      rows[code]={'code':code,'name':name,'market':'上市','assetType':'ETF','source':SOURCE,'sourceUrl':API+'?date='+date.strftime('%Y%m%d')+'&type=ALLBUT0999&response=json','latestDate':day,'close':c,'changeAmount':change,'changePct':pct,'bars':[[day,o,h,l,c,int(v)]],'barCount':1,'dataQuality':'short_history','nav':None,'premiumDiscountPct':None,'dividends':None,'institutional':None}
                  except (ValueError,IndexError,TypeError) as exc: print('MI_INDEX invalid ETF row',code,str(exc),flush=True)
              return rows
          
          def apply_daily(doc, fresh, codes, day):
              if doc is None: doc={'schema':1,'kind':'etf-official-eod','source':'TWSE official EOD','note':'ETF獨立官方日K；歷史未還原，不填假資料。','rows':[],'warnings':[]}
              if doc.get('schema')!=1 or doc.get('kind')!='etf-official-eod': raise ValueError('ETF schema mismatch')
              rows={r['code']:r for r in doc['rows']}
              if len(rows)!=len(doc['rows']): raise ValueError('duplicate existing code')
              for code in codes:
                  prior=rows.get(code)
                  if prior and prior['latestDate']>=day: continue
                  new=fresh.get(code)
                  if not new: continue
                  if new['latestDate']!=day or new['bars'][-1][0]!=day: raise ValueError('unexpected daily date')
                  bars={b[0]:b for b in prior['bars']} if prior else {}
                  bars[day]=new['bars'][0]
                  row=dict(new,bars=[bars[d] for d in sorted(bars)],barCount=len(bars),dataQuality='verified_ohlcv' if len(bars)>=20 else 'short_history')
                  # Keep historical distribution records, but never carry forward stale daily NAV or flows.
                  if prior and prior.get('dividends') is not None: row['dividends']=prior['dividends']
                  if prior:
                      for key in ('distributionDetail','fundTaxId'):
                          if prior.get(key) is not None: row[key]=prior[key]
                  rows[code]=row
                  print('ETF_MI_INDEX_APPLIED',code,day,row['close'],row['barCount'],flush=True)
              if not rows: raise ValueError('No verified ETF rows, cannot publish')
              result=dict(doc,rows=list(rows.values()),asOf=max(r['latestDate'] for r in rows.values()))
              return result
          
          def fetch(day):
              url=API+'?date='+day.replace('-','')+'&type=ALLBUT0999&response=json'
              for i in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=25) as res: return json.loads(res.read(16_000_000).decode('utf-8-sig'))
                  except (OSError,ValueError) as exc:
                      if i==2: raise
                      print('MI_INDEX retry',i+1,type(exc).__name__,flush=True); time.sleep(i+1)
          
          def main():
              p=Path('data/etf-daily.json'); doc=json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
              codes=json.loads(Path('data/etf-watchlist.json').read_text(encoding='utf-8'))['codes']
              day=os.environ.get('EXPECTED_DATE','').strip() or json.loads(Path('data/radar.json').read_text(encoding='utf-8')).get('asOf','')
              if dt.date.fromisoformat(day).isoformat()!=day or day>dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).date().isoformat(): raise ValueError('invalid expected_date')
              existing={r['code']:r for r in doc['rows']} if doc else {}
              stale=[c for c in codes if c not in existing or existing[c]['latestDate']<day]
              print('ETF_MI_INDEX_TARGET',day,'stale',','.join(stale),flush=True)
              if not stale: return
              fresh=parse_daily(fetch(day),day,set(stale))
              result=apply_daily(doc,fresh,codes,day)
              temp=p.with_suffix('.r191.tmp'); temp.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); temp.replace(p)
              remaining=[c for c in stale if c not in fresh]
              if remaining: print('::warning::ETF MI_INDEX still missing '+','.join(remaining),flush=True)
          
          if __name__=='__main__': main()
          PYDAILY
      - name: Fetch same-date ETF institutional flows (T86)
        if: ${{ !inputs.publish_only }}
        run: |
          python -u - <<'PYT86'
          import datetime as dt, json, re, sys, urllib.request
          from pathlib import Path
          FIELDS={
           'code':'證券代號', 'foreignNetShares':'外陸資買賣超股數(不含外資自營商)',
           'trustNetShares':'投信買賣超股數','dealerNetShares':'自營商買賣超股數',
           'dealerOwnNetShares':'自營商買賣超股數(自行買賣)', 'dealerHedgeNetShares':'自營商買賣超股數(避險)',
           'totalNetShares':'三大法人買賣超股數'}
          
          def norm(s): return re.sub(r'\s+','',str(s)).replace('（','(').replace('）',')')
          def integer(v):
              s=str(v).strip().replace(',','')
              if not re.fullmatch(r'[+-]?\d+',s): raise ValueError('invalid share count')
              return int(s)
          def parse(doc, day, codes):
              d=dt.date.fromisoformat(day); compact=d.strftime('%Y%m%d')
              title=str(doc.get('title','')); roc=re.search(r'(\d{2,3})年\s*(\d{1,2})月\s*(\d{1,2})日',title)
              title_day=dt.date(int(roc[1])+1911,int(roc[2]),int(roc[3])).isoformat() if roc else None
              raw=doc.get('date'); raw_day=str(raw) if raw is not None else None
              if doc.get('stat')!='OK' or (raw_day is None and title_day is None) or (raw_day is not None and raw_day not in (day,compact)) or (title_day is not None and title_day!=day): raise ValueError('T86 date or status mismatch')
              f=[norm(x) for x in doc['fields']]; idx={}
              for key,label in FIELDS.items():
                  if f.count(label)!=1: raise ValueError('T86 missing/duplicate column '+label)
                  idx[key]=f.index(label)
              out={}; seen=set()
              for row in doc['data']:
                  if not isinstance(row,list) or len(row)<=idx['code']: continue
                  code=str(row[idx['code']]).strip()
                  if code not in codes: continue
                  if code in seen: out.pop(code,None); continue
                  seen.add(code)
                  try:
                      rec={k:integer(row[i]) for k,i in idx.items() if k!='code'}
                      if rec['dealerNetShares']!=rec['dealerOwnNetShares']+rec['dealerHedgeNetShares'] or rec['totalNetShares']!=sum(rec[k] for k in ('foreignNetShares','trustNetShares','dealerNetShares')): raise ValueError('T86 reconciliation failed')
                      out[code]={'date':day,'source':'TWSE T86','unit':'shares',**rec}
                  except (ValueError,IndexError,TypeError): print('T86 invalid row',code,flush=True)
              return out
          
          def fetch(day):
              url='https://www.twse.com.tw/rwd/zh/fund/T86?date='+day.replace('-','')+'&selectType=ALLBUT0999&response=json'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}),timeout=25) as r:
                  return json.loads(r.read(8_000_000).decode('utf-8-sig'))
          
          def enrich(doc,fetcher=fetch):
              rows=doc['rows']; groups={}
              for r in rows:
                  groups.setdefault(r['latestDate'],set()).add(r['code'])
              # Only query the latest date and retain other dates as unavailable.
              day=max(groups); result={}
              try: result=parse(fetcher(day),day,groups[day])
              except Exception as exc: print('::warning::ETF T86 unavailable: '+str(exc)[:180],flush=True)
              for r in rows:
                  rec=result.get(r['code']) if r['latestDate']==day else None
                  # Never present a stale or unverified row as current.
                  r['institutional']=rec
                  print('ETF_T86',r['code'],r['latestDate'],'verified' if rec else 'unavailable',flush=True)
              return doc
          
          if __name__=='__main__':
              p=Path('data/etf-daily.json'); doc=json.loads(p.read_text(encoding='utf-8'))
              enrich(doc)
              temp=p.with_suffix('.r190.tmp');temp.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');temp.replace(p)
          PYT86
      - name: Collect ETF NAV and distributions (R197 open data)
        if: ${{ !inputs.publish_only }}
        timeout-minutes: 3
        run: |
          python -u - <<'PYEXTRA'
          import csv, datetime as dt, io, json, math, re, unicodedata, urllib.request, urllib.parse
          from pathlib import Path
          NAV_URL='https://www.sitca.org.tw/MemberK0000/F/03/nav.csv'
          DIV_URL='https://www.sitca.org.tw/MemberK0000/F/03/'+urllib.parse.quote('160547投信投顧公會境內基金配息資料.csv')
          SOURCE='SITCA open data 11109/160547'
          
          def norm(s): return re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s or ''))).strip('\ufeff')
          def day(s):
              s=norm(s).replace('年','/').replace('月','/').replace('日','').replace('-','/')
              try:
                  if re.fullmatch(r'\d{7,8}',s): a,b,c=s[:-4],s[-4:-2],s[-2:]
                  else: a,b,c=s.split('/')
                  y=int(a)+(1911 if len(a)<=3 else 0)
                  return dt.date(y,int(b),int(c)).isoformat()
              except (TypeError,ValueError): return None
          
          def num(s):
              try:
                  v=float(norm(s).replace(',','')); return v if math.isfinite(v) and v>=0 else None
              except (ValueError,TypeError): return None
          
          def parse_csv(raw,required):
              for enc in ('utf-8-sig','cp950','big5'):
                  try: text=raw.decode(enc); break
                  except UnicodeDecodeError: continue
              else: raise ValueError('CSV encoding unknown')
              reader=csv.DictReader(io.StringIO(text)); fields=[norm(x) for x in (reader.fieldnames or [])]
              if not set(required)<=set(fields) or len(fields)!=len(set(fields)): raise ValueError('CSV header mismatch: '+str(fields))
              return [{norm(k):v for k,v in r.items() if k is not None} for r in reader]
          
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Chaopan-R197','Accept':'text/csv,*/*'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  raw=resp.read(32_000_001)
              if len(raw)>32_000_000: raise ValueError('CSV exceeds size limit')
              return raw
          
          def twd(s): return norm(s).upper() in ('TWD','NTD','台幣','臺幣','新台幣','新臺幣','新台幣元','新臺幣元')
          
          def enrich(doc,navrows,divrows,today):
              for r in doc['rows']:
                  code=r['code']; date=r['latestDate']; close=num(r['close'])
                  matched=[x for x in navrows if norm(x.get('受益憑證代號')).upper()==code and twd(x.get('幣別'))]
                  ids={norm(x.get('基金統編')) for x in matched if re.fullmatch(r'\d{8}',norm(x.get('基金統編')))}
                  # A fund ID previously verified from an exact code/currency match can bridge temporary NAV failures.
                  if len(ids)==1: r['fundTaxId']=next(iter(ids))
                  elif not ids and re.fullmatch(r'\d{8}',str(r.get('fundTaxId',''))): ids={r['fundTaxId']}
                  values={num(x.get('基金淨值')) for x in matched if day(x.get('日期'))==date}
                  valid=len(ids)==1 and len(values)==1 and None not in values and next(iter(values))>0 and close is not None and close>0 and date<=today
                  # Do not overwrite same-date verified data on transient source failure.
                  old=r.get('navDetail') or {}
                  if valid:
                      nav=next(iter(values)); r['navDetail']={'date':date,'nav':nav,'source':SOURCE,'currency':'TWD'}
                  elif old.get('date')!=date or old.get('source')!=SOURCE: r['navDetail']=None
                  # Bind dividend records to fund tax ID, not approximate name matching.
                  previous=r.get('distributionDetail') or {}
                  events={}
                  for x in divrows:
                      if len(ids)!=1 or norm(x.get('基金統編')) not in ids or not twd(x.get('配息幣別')): continue
                      ex,pay,amt=day(x.get('除息日')),day(x.get('收益分配發放日')),num(x.get('每單位分派金額'))
                      if not ex or not pay or pay<ex or amt is None or amt<=0: continue
                      events.setdefault(ex,set()).add((pay,amt))
                  records=[{'exDate':ex,'payDate':next(iter(v))[0],'amount':next(iter(v))[1],'source':SOURCE} for ex,v in events.items() if len(v)==1]
                  # R201a: reconcile retained records as a group, never pick the first conflicting record.
                  # A newly fetched unambiguous official record may supersede prior history.
                  conflicts={ex for ex,v in events.items() if len(v)!=1}
                  conflicts.update(ex for ex in previous.get('conflictDates',[]) if day(ex) and ex not in events)
                  oldhist=previous.get('history') or []
                  retained={}
                  for oldrec in [*oldhist,previous.get('latest')]:
                      if not isinstance(oldrec,dict) or oldrec.get('source') not in (SOURCE,'TWSE announcement 2026-10-30'): continue
                      ex,pay,amt=day(oldrec.get('exDate')),day(oldrec.get('payDate')),num(oldrec.get('amount'))
                      if not ex or not pay or pay<ex or amt is None or amt<=0 or ex in events or ex in conflicts: continue
                      retained.setdefault(ex,{}).setdefault((pay,amt),set()).add(oldrec['source'])
                  # Independently verified announcement participates in conflict detection too.
                  if code=='00406A' and '2026-11-03' not in events and '2026-11-03' not in conflicts:
                      retained.setdefault('2026-11-03',{}).setdefault(('2026-11-27',0.138),set()).add('TWSE announcement 2026-10-30')
                  for ex,candidates in retained.items():
                      if len(candidates)!=1:
                          conflicts.add(ex); continue
                      (pay,amt),sources=next(iter(candidates.items()))
                      records.append({'exDate':ex,'payDate':pay,'amount':amt,'source':SOURCE if SOURCE in sources else 'TWSE announcement 2026-10-30'})
                  records=sorted((z for z in records if z['exDate'] not in conflicts),key=lambda x:x['exDate'])
                  latest=records[-1] if records else None
                  # Preserve unresolved announced date until a verified amount is collected, including after ex-date.
                  next_ex='2026-12-02' if code=='00406A' and not any(z['exDate']=='2026-12-02' for z in records) else None
                  r['distributionDetail']={'latest':latest,'history':records,'conflictDates':sorted(conflicts),'nextExPending':next_ex} if records or next_ex or conflicts else None
                  print('R197_ETF_EXTRA',code,date,'NAV',bool(r.get('navDetail')),'DIV',bool(latest),flush=True)
                  if not r.get('navDetail'): print('::warning::ETF NAV unavailable for '+code+' '+date+'; no stale NAV used',flush=True)
                  if not latest: print('::warning::ETF distribution unavailable for '+code,flush=True)
              return doc
          
          def main():
              nav=[]; div=[]
              for name,url,fields in [('nav',NAV_URL,['日期','基金統編','基金淨值','幣別','受益憑證代號']),('div',DIV_URL,['基金統編','配息幣別','除息日','收益分配發放日','每單位分派金額'])]:
                  try:
                      rows=parse_csv(fetch(url),fields)
                      if name=='nav': nav=rows
                      else: div=rows
                      print('R197_CSV',name,len(rows),flush=True)
                  except Exception as e: print('::warning::R195 '+name+' source unavailable: '+str(e)[:180],flush=True)
              p=Path('data/etf-daily.json'); doc=json.loads(p.read_text(encoding='utf-8'))
              enrich(doc,nav,div,dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).date().isoformat())
              temp=p.with_suffix('.r195.tmp'); temp.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');temp.replace(p)
          if __name__=='__main__': main()
          PYEXTRA
      - name: Verify ETF parser after enrichment
        if: ${{ !inputs.publish_only }}
        run: python -m unittest scripts/test_etf_daily.py -v
      - name: Commit only independent ETF feed with safe retry
        if: ${{ !inputs.publish_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-daily.json
          if git diff --cached --quiet; then echo "ETF data unchanged"; exit 0; fi
          git commit -m "data: R197 refresh ETF EOD T86 NAV distributions"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if git merge-base --is-ancestor HEAD origin/main; then echo "ETF_PUSH_OK already published"; exit 0; fi
            base=$(git rev-parse HEAD^)
            git merge-base --is-ancestor "$base" origin/main || { echo "::error::Remote history changed"; exit 1; }
            if [ "$base" != "$(git rev-parse origin/main)" ]; then
              if ! git diff --quiet "$base" origin/main -- data/etf-daily.json data/etf-watchlist.json scripts/update_etf_daily.py scripts/test_etf_daily.py .github/workflows/etf-daily.yml; then
                echo "::error::ETF inputs or ETF output changed remotely; run new workflow; no data overwritten"; exit 1
              fi
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            fi
            if git push origin HEAD:refs/heads/main; then echo "ETF_PUSH_OK"; exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo "::error::ETF push retries exhausted; no force push"; exit 1
      - name: Publish Pages and verify ETF date for every watched code
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DATE: ${{ inputs.expected_date }}
        run: |
          python -u - <<'PYPUBLISH'
          import os, json, time, subprocess, urllib.request, urllib.error, datetime as dt, hashlib
          FILE='data/etf-daily.json'
          def request(url,method='GET',token=None):
              h={'User-Agent':'Chaopan-R188','Cache-Control':'no-cache'}
              if token: h.update({'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(urllib.request.Request(url,data=b'' if method=='POST' else None,headers=h,method=method),timeout=25) as r: return r.status,r.read()
          def get_main(path):
              return subprocess.check_output(['git','show','origin/main:'+path])
          def check_fresh(raw,codes,minimum):
              obj=json.loads(raw); rows={r['code']:r for r in obj['rows']}; stale=[]
              if minimum and dt.date.fromisoformat(minimum).isoformat()!=minimum: raise ValueError('invalid expected date')
              for c in codes:
                  r=rows.get(c); d=r['latestDate'] if r else 'missing'
                  print('ETF_DATE',c,d,'expected',minimum,flush=True)
                  if not r or (minimum and d<minimum): stale.append(c)
              return stale

          def publish(expected,site,api,token,attempts=18,interval=15):
              def check():
                  try:
                      _,raw=request(site+'?r188='+str(time.time_ns())); return hashlib.sha256(raw).digest()==hashlib.sha256(expected).digest()
                  except (OSError,ValueError) as e: print('ETF_PAGES_PENDING',type(e).__name__); return False
              if check(): print('ETF_PAGES_OK already current'); return
              try:
                  status,_=request(api,'POST',token); print('ETF_PAGES_BUILD',status)
              except urllib.error.HTTPError as e: print('::warning::Pages build HTTP '+str(e.code)+'; checking live site')
              for _ in range(attempts):
                  time.sleep(interval)
                  if check(): print('ETF_PAGES_OK'); return
              raise RuntimeError('ETF data committed but Pages has not served matching bytes; use publish_only, do not re-fetch')

          def main():
              subprocess.run(['git','fetch','--no-tags','origin','+refs/heads/main:refs/remotes/origin/main'],check=True)
              raw=get_main(FILE); codes=json.loads(get_main('data/etf-watchlist.json'))['codes']
              minimum=os.environ.get('EXPECTED_DATE','').strip() or json.loads(get_main('data/radar.json')).get('asOf','')
              if not minimum: raise ValueError('cannot verify date; enter expected_date')
              stale=check_fresh(raw,codes,minimum)
              publish(raw,'https://love18960928-lgtm.github.io/chaopan-radar/'+FILE,os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds',os.environ['GH_TOKEN'])
              if stale: raise RuntimeError('ETF still missing/stale: '+','.join(stale)+'; available verified data retained and published')
              rows={r['code']:r for r in json.loads(raw)['rows']}
              if '00406A' in codes and minimum>='2026-11-03':
                  latest=(rows.get('00406A',{}).get('distributionDetail') or {}).get('latest') or {}
                  if not latest or latest.get('exDate','')<'2026-11-03':
                      raise RuntimeError('00406A verified distribution missing; price data retained, enrichment not accepted')
                  print('R197_00406A_DISTRIBUTION',latest['exDate'],latest['payDate'],latest['amount'],flush=True)
              print('R197_ETF_OK',minimum)
          if __name__=='__main__': main()
          PYPUBLISH
