name: MA120 MA240 歷史資料回補與驗證
on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '每次回補日曆天數（1～120，建議90）'
        required: true
        default: '90'
      backfill_offset_days:
        description: '回補窗口結束距今幾天（依次0、90、180、270、360、450）'
        required: true
        default: '0'
permissions:
  contents: write
jobs:
  backfill:
    # Do not publish intermediate radar/universe without rebuilt lookup and contexts.
    # Concurrency is defined in the called workflow, not duplicated in the caller.
    uses: ./.github/workflows/eod-radar.yml
    with:
      backfill_days: ${{ inputs.backfill_days }}
      backfill_offset_days: ${{ inputs.backfill_offset_days }}
